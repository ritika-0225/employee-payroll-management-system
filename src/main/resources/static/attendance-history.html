<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Attendance History</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: #f5f7fb;
}

/* Navbar */
.navbar {
    background: linear-gradient(135deg, #5f6fdc, #7b4bc4);
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logout-btn {
    background: #e74c3c;
    border: none;
    padding: 8px 14px;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

/* Container */
.container {
    padding: 40px;
}

/* Top Bar */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.title {
    font-size: 26px;
    font-weight: 600;
}

/* Search */
.search-box {
    position: relative;
}

/* Empty state */
.no-data {
    text-align: center;
    padding: 25px;
    color: #888;
    font-size: 14px;
}

.search-box input {
    padding: 8px 35px 8px 10px;
    border-radius: 6px;
    border: 1px solid #ddd;
}

.search-box i {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #777;
}

/* Card */
.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 14px;
    text-align: center;
    border-bottom: 1px solid #eee;
}

th {
    background: #5f6fdc;
    color: white;
    font-weight: 500;
}

/* Rows */
tbody tr:nth-child(even) {
    background: #fafafa;
}

tbody tr:hover {
    background: #f0f4ff;
}

/* Status badge */
.badge {
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
}

.present {
    background: #eafaf1;
    color: #27ae60;
}

.absent {
    background: #fdecea;
    color: #e74c3c;
}

/* Time styling */
.time {
    font-size: 13px;
    color: #555;
}

</style>
</head>

<body>

<div class="navbar">
    <h2>Payroll System</h2>
    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="container">

    <div class="top-bar">
        <div class="title">Attendance History</div>

        <div class="search-box">
            <input type="text" id="search" placeholder="Search by ID...">
            <i class="fa fa-search"></i>
        </div>
    </div>

    <div class="card">

        <table>
            <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Status</th>
                    <th>Latitude</th>
                    <th>Longitude</th>
                    <th>Date & Time</th>
                </tr>
            </thead>
            <tbody id="tableData"></tbody>
        </table>

    </div>

</div>

<script>

let allData = [];

function logout() {
    window.location.href = "login.html";
}

/* Format date */
function formatDateTime(raw) {
    let date = new Date(raw);

    let d = date.toLocaleDateString();
    let t = date.toLocaleTimeString();

    return `${d}<div class="time">${t}</div>`;
}

/* Load */
function loadHistory() {
    fetch("http://localhost:8080/getAttendance")
    .then(res => res.json())
    .then(data => {
        allData = data;
        renderTable(data);
    });
}

/* Render */
function renderTable(data) {
    let table = document.getElementById("tableData");
    table.innerHTML = "";

    if (data.length === 0) {
        table.innerHTML = `
            <tr>
                <td colspan="5" class="no-data">
                    <i class="fa-solid fa-circle-exclamation"></i><br><br>
                    No attendance records found
                </td>
            </tr>
        `;
        return;
    }

    data.forEach(a => {

        let statusClass = a.status === "Present" ? "present" : "absent";

        let row = `
            <tr>
                <td>${a.empId}</td>
                <td><span class="badge ${statusClass}">${a.status}</span></td>
                <td>${a.lat}</td>
                <td>${a.lng}</td>
                <td>${formatDateTime(a.time)}</td>
            </tr>
        `;

        table.innerHTML += row;
    });
}

/* Search */
document.getElementById("search").addEventListener("input", function() {
    let value = this.value.toLowerCase();

    let filtered = allData.filter(a =>
        a.empId.toString().includes(value)
    );

    renderTable(filtered);
});

loadHistory();

</script>

</body>
</html>
