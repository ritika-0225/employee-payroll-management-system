<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: #f5f7fb;
}

/* Navbar */
.navbar {
    background: linear-gradient(135deg, #5f6fdc, #7b4bc4);
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logout-btn {
    background: #e74c3c;
    border: none;
    padding: 8px 14px;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

/* Container */
.container {
    padding: 35px;
}

/* Title */
.title {
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 25px;
}

/* Stats */
.stats {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
}

.stat-card {
    flex: 1;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 5px 12px rgba(0,0,0,0.06);
}

.stat-card h4 {
    font-size: 14px;
    color: #777;
}

.stat-card h2 {
    margin-top: 8px;
    font-size: 28px;
}

/* Action Cards */
.cards {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
}

.card {
    width: 180px;   /* fixed size */
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.08);
    cursor: pointer;
    text-align: center;
    transition: 0.2s;
}

.card:hover {
    transform: translateY(-4px);
}

.icon {
    font-size: 28px;
    color: #5f6fdc;
    margin-bottom: 10px;
}

.card h3 {
    margin-bottom: 5px;
}

.card p {
    font-size: 13px;
    color: #777;
}

</style>
</head>

<body>

<div class="navbar">
    <h2>Admin Dashboard</h2>
    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="container">

    <div class="title">Dashboard</div>

    <!-- Stats Section -->
    <div class="stats">
        <div class="stat-card">
            <h4>Total Employees</h4>
            <h2 id="empCount">0</h2>
        </div>

        <div class="stat-card">
            <h4>Present</h4>
            <h2 id="presentCount">0</h2>
        </div>

        <div class="stat-card">
            <h4>Absent</h4>
            <h2 id="absentCount">0</h2>
        </div>
    </div>

    <!-- Action Cards -->
    <div class="cards">

        <div class="card" onclick="goTo('employee.html')">
            <div class="icon"><i class="fa-solid fa-users"></i></div>
            <h3>Employees</h3>
            <p>Manage employee records</p>
        </div>

        <div class="card" onclick="goTo('attendance-history.html')">
            <div class="icon"><i class="fa-solid fa-calendar-check"></i></div>
            <h3>Attendance</h3>
            <p>Track attendance history</p>
        </div>
		
		<div class="card" onclick="goTo('salary.html')">
		    <div class="icon"><i class="fa-solid fa-money-bill"></i></div>
		    <h3>Salary</h3>
		    <p>Calculate payroll</p>
		</div>

    </div>

</div>

<script>

function goTo(page) {
    window.location.href = page;
}

function logout() {
    window.location.href = "login.html";
}

/* Load stats */
function loadStats() {

    // Employee count
    fetch("http://localhost:8080/employees")
    .then(res => res.json())
    .then(data => {
        document.getElementById("empCount").innerText = data.length;
    });

    // Attendance count
    fetch("http://localhost:8080/getAttendance")
    .then(res => res.json())
    .then(data => {

        let present = data.filter(a => a.status === "Present").length;
        let absent = data.filter(a => a.status === "Absent").length;

        document.getElementById("presentCount").innerText = present;
        document.getElementById("absentCount").innerText = absent;
    });
}

loadStats();

</script>

</body>
</html>
