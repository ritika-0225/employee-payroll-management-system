<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Employees</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: #f5f7fb;
}

/* Navbar */
.navbar {
    background: linear-gradient(135deg, #5f6fdc, #7b4bc4);
    color: white;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logout-btn {
    background: #e74c3c;
    border: none;
    padding: 8px 14px;
    color: white;
    border-radius: 6px;
    cursor: pointer;
}

/* Container */
.container {
    padding: 40px;
}

/* Header Row */
.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.title {
    font-size: 26px;
    font-weight: 600;
}

/* Search */
.search-box {
    position: relative;
}

/* Empty state */
.no-data {
    text-align: center;
    padding: 25px;
    color: #888;
    font-size: 14px;
}

.search-box input {
    padding: 8px 35px 8px 10px;
    border-radius: 6px;
    border: 1px solid #ddd;
}

.search-box i {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #777;
}

/* Card */
.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    margin-bottom: 25px;
}

/* Form */
.form-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.form-group input {
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ddd;
    width: 180px;
}

/* Buttons */
.add-btn {
    background: #5f6fdc;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    cursor: pointer;
}

.add-btn:hover {
    background: #4b5bd1;
}

.edit-btn {
    background: #2ecc71;
    border: none;
    padding: 6px 10px;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

/* Table */
table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 14px;
    text-align: center;
    border-bottom: 1px solid #eee;
}

th {
    background: #5f6fdc;
    color: white;
    font-weight: 500;
}

/* Row effects */
tbody tr:nth-child(even) {
    background: #fafafa;
}

tbody tr:hover {
    background: #f0f4ff;
}

</style>
</head>

<body>

<div class="navbar">
    <h2>Payroll System</h2>
    <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="container">

    <div class="top-bar">
        <div class="title">Employee Management</div>

        <div class="search-box">
            <input type="text" id="search" placeholder="Search...">
            <i class="fa fa-search"></i>
        </div>
    </div>

    <!-- Add Employee -->
    <div class="card">
        <h3>Add / Edit Employee</h3><br>

        <div class="form-group">
            <input type="text" id="name" placeholder="Name">
            <input type="text" id="department" placeholder="Department">
            <input type="number" id="salary" placeholder="Salary">
            <input type="email" id="email" placeholder="Email">

            <button class="add-btn" id="mainBtn" onclick="addEmployee()">Add</button>
        </div>
    </div>

    <!-- Table -->
    <div class="card">

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Email</th>
                    <th>Edit</th>
                </tr>
            </thead>
            <tbody id="employeeTable"></tbody>
        </table>

    </div>

</div>

<script>

let editingId = null;
let allEmployees = [];

function logout() {
    window.location.href = "login.html";
}

/* Add Employee */
function addEmployee() {

    let name = document.getElementById("name").value.trim();
    let department = document.getElementById("department").value.trim();
    let salary = document.getElementById("salary").value.trim();
    let email = document.getElementById("email").value.trim();

    if (name === "" || department === "" || salary === "" || email === "") {
        alert("Please fill all fields");
        return;
    }

    if (!email.includes("@")) {
        alert("Enter valid email");
        return;
    }

    let emp = { name, department, salary, email };

    if (editingId !== null) {
        updateEmployee(editingId);
        return;
    }

    fetch("http://localhost:8080/addEmployee", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(emp)
    })
    .then(res => res.json())
    .then(() => {
        alert("Employee Added");
        clearForm();
        loadEmployees();
    });
}

/* Load */
function loadEmployees() {
    fetch("http://localhost:8080/employees")
    .then(res => res.json())
    .then(data => {
        allEmployees = data;
        renderTable(data);
    });
}

/* Render */
function renderTable(data) {
    let table = document.getElementById("employeeTable");
    table.innerHTML = "";

    if (data.length === 0) {
        table.innerHTML = `
            <tr>
                <td colspan="6" class="no-data">
                    <i class="fa-solid fa-circle-exclamation"></i><br><br>
                    No employees found
                </td>
            </tr>
        `;
        return;
    }

    data.forEach(emp => {
        let row = `
            <tr>
                <td>${emp.id}</td>
                <td>${emp.name}</td>
                <td>${emp.department}</td>
                <td>${emp.salary}</td>
                <td>${emp.email}</td>
                <td>
                    <button class="edit-btn"
                        onclick="editEmployee(${emp.id}, '${emp.name}', '${emp.department}', '${emp.salary}', '${emp.email}')">
                        Edit
                    </button>
                </td>
            </tr>
        `;
        table.innerHTML += row;
    });
}

/* Search */
document.getElementById("search").addEventListener("input", function() {
    let value = this.value.toLowerCase();

    let filtered = allEmployees.filter(emp =>
        emp.name.toLowerCase().includes(value) ||
        emp.department.toLowerCase().includes(value)
    );

    renderTable(filtered);
});

/* Edit */
function editEmployee(id, name, department, salary, email) {

    document.getElementById("name").value = name;
    document.getElementById("department").value = department;
    document.getElementById("salary").value = salary;
    document.getElementById("email").value = email;

    editingId = id;
    document.getElementById("mainBtn").innerText = "Update";
}

/* Update */
function updateEmployee(id) {

    let emp = {
        name: document.getElementById("name").value,
        department: document.getElementById("department").value,
        salary: document.getElementById("salary").value,
        email: document.getElementById("email").value
    };

    fetch(`http://localhost:8080/updateEmployee/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(emp)
    })
    .then(() => {
        alert("Employee Updated");
        editingId = null;
        document.getElementById("mainBtn").innerText = "Add";
        clearForm();
        loadEmployees();
    });
}

/* Clear */
function clearForm() {
    document.getElementById("name").value = "";
    document.getElementById("department").value = "";
    document.getElementById("salary").value = "";
    document.getElementById("email").value = "";
}

loadEmployees();

</script>

</body>
</html>
