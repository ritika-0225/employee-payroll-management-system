<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Employee Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#f5f7fb;
}

/* Navbar */

.navbar{
background:linear-gradient(135deg,#5f6fdc,#7b4bc4);
color:white;
padding:15px 30px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logout-btn{
background:red;
color:white;
border:none;
padding:8px 14px;
border-radius:6px;
cursor:pointer;
}

/* Content */

.container{
padding:30px;
}

.title{
font-size:26px;
margin-bottom:20px;
}

/* Cards */

.cards{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.card{
background:white;
padding:25px;
border-radius:12px;
width:220px;
box-shadow:0 6px 15px rgba(0,0,0,0.08);
cursor:pointer;
text-align:center;
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
}

.icon{
font-size:30px;
color:#5f6fdc;
margin-bottom:10px;
}

.card h3{
margin-bottom:5px;
}

.card p{
font-size:13px;
color:#777;
}

</style>
</head>

<body>

<!-- Navbar -->

<div class="navbar">
<h2>Employee Dashboard</h2>
<button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="container">

<div class="title">Dashboard</div>

<div class="cards">

<!-- CHECK IN -->

<div class="card" onclick="goTo('attendance.html')">
<div class="icon">
<i class="fa-solid fa-location-dot"></i>
</div>
<h3>Check In</h3>
<p>Mark your attendance</p>
</div>

<!-- CHECK OUT -->

<div class="card" onclick="goTo('checkout.html')">
<div class="icon">
<i class="fa-solid fa-right-from-bracket"></i>
</div>
<h3>Check Out</h3>
<p>Mark your exit time</p>
</div>

</div>

</div>

<script>

function goTo(page){
window.location.href=page;
}

function logout(){
window.location.href="login.html";
}

</script>

</body>
</html>
